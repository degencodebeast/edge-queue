[project]
name = "edgequeue"
version = "0.1.0"
description = "Fixed-budget review allocation for agent trajectory evaluations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
edgequeue = "edgequeue.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgequeue"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
